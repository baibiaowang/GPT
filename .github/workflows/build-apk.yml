name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'www/**'
      - 'native/**'
      - 'capacitor.config.json'
      - 'package.json'
      - '.github/workflows/build-apk.yml'
      - 'update.json'

permissions:
  contents: write

env:
  APP_VERSION_CODE: '1600'
  APP_VERSION_NAME: '1.6.0'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare web assets
        run: node native/inject.mjs

      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund

      - name: Add Android platform
        run: |
          npx cap add android

      - name: Inject native support
        run: |
          mkdir -p android/app/src/main/java/com/baibiaowang/stockjudge
          cp native/MainActivity.java android/app/src/main/java/com/baibiaowang/stockjudge/MainActivity.java
          node native/patch-manifest.mjs
          APP_VERSION_CODE="$APP_VERSION_CODE" APP_VERSION_NAME="$APP_VERSION_NAME" node native/patch-version.mjs

      - name: Sync web assets
        run: |
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Verify APK version
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          echo "Built stock judge app v$APP_VERSION_NAME (code $APP_VERSION_CODE)"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: stock-judge-gpt-v1.6.0-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish latest APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.6.0
          name: 股票判断机 GPT 最新版 v1.6.0
          body: |
            股票判断机 GPT 专用仓库最新版。
            版本：v1.6.0
          prerelease: false
          make_latest: true
          overwrite_files: true
          files: android/app/build/outputs/apk/debug/app-debug.apk
