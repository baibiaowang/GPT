name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'www/**'
      - 'native/**'
      - 'capacitor.config.json'
      - 'package.json'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

concurrency:
  group: gpt-build-apk-${{ github.ref }}
  cancel-in-progress: true


env:
  # ★ 2026-09-20 改：原来从私有仓 APKSecrets 取 keystore，需要额外的
  #   APKSECRETS_TOKEN（一直没配，构建必然失败，见 run 35501438918）。
  #   现在改成直接用本仓库的 Secret（base64），少一个依赖、少一个失败点。
  # ★ versionCode 在 Compute version 里算 —— GitHub 表达式不支持算术运算符，
  #   写 ${{ 1600 + github.run_number }} 会让整个 workflow 编译失败（0 个 job）。
  ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
  ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
  ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 版本唯一来源：www/core/app-runtime.js；package.json 同时做一致性校验
      - name: Set release version
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const runtime = fs.readFileSync('www/core/app-runtime.js', 'utf8');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const vm = runtime.match(/version:\s*['"]([^'"]+)['"]/);
          const cm = runtime.match(/versionCode:\s*(\d+)/);
          if (!vm || !cm) throw new Error('runtime version fields missing');
          if (String(pkg.version) !== vm[1]) throw new Error('package.json version mismatch: ' + pkg.version + ' != ' + vm[1]);
          if (!/^\d+$/.test(cm[1]) || Number(cm[1]) <= 0) throw new Error('runtime versionCode invalid: ' + cm[1]);
          const env = 'APP_VERSION_NAME=' + vm[1] + '\nAPP_VERSION_CODE=' + cm[1] + '\n';
          fs.appendFileSync(process.env.GITHUB_ENV, env);
          console.log('version -> name=' + vm[1] + ' code=' + cm[1]);
          NODE

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # ★ 固定签名第一步：从本仓库 Secret 恢复 keystore（放仓库根，不依赖 android/）
      - name: Prepare fixed signing material
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          MISSING=""
          [ -z "${ANDROID_KEYSTORE_BASE64:-}" ] && MISSING="$MISSING ANDROID_KEYSTORE_BASE64"
          [ -z "${ANDROID_KEYSTORE_PASSWORD:-}" ] && MISSING="$MISSING ANDROID_KEYSTORE_PASSWORD"
          [ -z "${ANDROID_KEY_ALIAS:-}" ] && MISSING="$MISSING ANDROID_KEY_ALIAS"
          [ -z "${ANDROID_KEY_PASSWORD:-}" ] && MISSING="$MISSING ANDROID_KEY_PASSWORD"
          if [ -n "$MISSING" ]; then
            echo "::error::Missing Android signing secrets:$MISSING"
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > signing.p12
          echo "SIGNING_KEYSTORE_PATH=$(pwd)/signing.p12" >> "$GITHUB_ENV"
          echo "[signing] keystore restored ($(wc -c < signing.p12) bytes)"

      - name: Verify live SJ01 data envelope
        shell: bash
        run: |
          set -euo pipefail
          URL='https://stocks-txt-file.app.workbuddy.host/stocks.txt'
          curl -fsSL --retry 2 --connect-timeout 15 --max-time 60 -H 'Accept-Encoding: identity' "$URL" -o live-stocks.txt
          test -s live-stocks.txt
          python - <<'PY'
          import base64, pathlib
          raw=pathlib.Path('live-stocks.txt').read_text(encoding='utf-8-sig').strip()
          raw=''.join(raw.split())
          raw=raw.replace('-','+').replace('_','/')
          raw += '='*((4-len(raw)%4)%4)
          data=base64.b64decode(raw, validate=False)
          if len(data)<33:
              raise SystemExit('live stocks.txt is not a valid SJ01 payload: too short')
          header=data[:4].decode('ascii','replace')
          version=data[4]
          if header!='SJ01' or version!=3:
              raise SystemExit(f'live stocks.txt header mismatch: header={header!r}, version={version}')
          print(f'live SJ01 envelope OK: bytes={len(data)}, header={header}, version=0x{version:02x}')
          PY
          rm -f live-stocks.txt

      - name: Prepare web assets
        run: node native/inject.mjs

      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund

      - name: Add Android platform
        run: |
          npx cap add android

      - name: Inject native support
        run: |
          mkdir -p android/app/src/main/java/com/baibiaowang/stockjudge
          cp native/MainActivity.java android/app/src/main/java/com/baibiaowang/stockjudge/MainActivity.java
          node native/patch-manifest.mjs
          APP_VERSION_CODE="$APP_VERSION_CODE" APP_VERSION_NAME="$APP_VERSION_NAME" node native/patch-version.mjs

      # ★ 固定签名第二步：注入 signingConfigs（android/ 是 cap add 生成的，每次都要重新注入）
      - name: Configure fixed release signing
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const p = 'android/app/build.gradle';
          if (!fs.existsSync(p)) {
            console.error('::error::android/app/build.gradle not found');
            process.exit(1);
          }

          let s = fs.readFileSync(p, 'utf8');
          if (!/android\s*\{/.test(s) || !/buildTypes\s*\{/.test(s)) {
            console.error('::error::Unexpected Android Gradle file layout.');
            process.exit(1);
          }

          if (!/signingConfigs\s*\{/.test(s)) {
            s = s.replace(
              /buildTypes\s*\{/,
              `signingConfigs {
                  release {
                      storeFile file(System.getenv('SIGNING_KEYSTORE_PATH'))
                      storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                      keyAlias System.getenv('ANDROID_KEY_ALIAS')
                      keyPassword System.getenv('ANDROID_KEY_PASSWORD')
                  }
              }

              buildTypes {`
            );
          }

          const releaseBlock = /buildTypes\s*\{\s*release\s*\{/;
          if (!releaseBlock.test(s)) {
            console.error('::error::release buildType not found.');
            process.exit(1);
          }

          if (!/buildTypes\s*\{\s*release\s*\{[^}]*signingConfig\s+signingConfigs\.release/s.test(s)) {
            s = s.replace(
              releaseBlock,
              `buildTypes {
                  release {
                      signingConfig signingConfigs.release`
            );
          }

          fs.writeFileSync(p, s);
          console.log('[signing] fixed release signing configured.');
          NODE

      - name: Sync web assets
        run: |
          npx cap sync android

      - name: Build fixed-signed release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      # ★ 当场验收签名，签错就在这步炸
      - name: Normalize and verify APK
        run: |
          set -euo pipefail
          APK_SRC="android/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK_SRC"
          BT=$(ls -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/build-tools/*/ 2>/dev/null | sort -V | tail -1)
          "${BT}apksigner" verify --print-certs "$APK_SRC" | head -12
          mkdir -p dist
          cp "$APK_SRC" dist/app.apk
          echo "Built GPT app v$APP_VERSION_NAME (code $APP_VERSION_CODE) with fixed release signing."

      - name: Verify release signing continuity
        shell: bash
        run: |
          set -euo pipefail
          BT=$(ls -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/build-tools/*/ 2>/dev/null | sort -V | tail -1)
          APK_SRC="android/app/build/outputs/apk/release/app-release.apk"
          CURRENT_DIGEST=$("${BT}apksigner" verify --print-certs "$APK_SRC" | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)
          test -n "$CURRENT_DIGEST"
          for PREVIOUS_VERSION in 2.1.6 1.6.4; do
            curl -fsSL --retry 3 --connect-timeout 15 --max-time 60 \
              "https://github.com/${GITHUB_REPOSITORY}/releases/download/v${PREVIOUS_VERSION}/app.apk" \
              -o "/tmp/previous-${PREVIOUS_VERSION}.apk"
            PREVIOUS_DIGEST=$("${BT}apksigner" verify --print-certs "/tmp/previous-${PREVIOUS_VERSION}.apk" | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)
            test -n "$PREVIOUS_DIGEST"
            echo "Current APK cert:       $CURRENT_DIGEST"
            echo "v${PREVIOUS_VERSION} APK cert: $PREVIOUS_DIGEST"
            test "$CURRENT_DIGEST" = "$PREVIOUS_DIGEST"
          done
          echo "Release signing continuity verified against v2.1.6 and v1.6.4."
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: stock-judge-gpt-v${{ env.APP_VERSION_NAME }}-apk
          path: dist/app.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK mirror
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/gpt-apk-mirror
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" /tmp/gpt-apk-mirror
          cd /tmp/gpt-apk-mirror
          if git ls-remote --exit-code origin refs/heads/apk >/dev/null 2>&1; then
            git fetch origin refs/heads/apk:refs/remotes/origin/apk
            git checkout -B apk refs/remotes/origin/apk
          else
            git checkout --orphan apk
            git rm -rf . >/dev/null 2>&1 || true
          fi
          mkdir -p "releases/${APP_VERSION_NAME}"
          cp "${GITHUB_WORKSPACE}/dist/app.apk" "releases/${APP_VERSION_NAME}/app.apk"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "releases/${APP_VERSION_NAME}/app.apk"
          if git diff --cached --quiet; then
            echo "APK mirror already contains ${APP_VERSION_NAME}"
          else
            git commit -m "发布 APK ${APP_VERSION_NAME}"
            git push origin HEAD:apk
          fi

      - name: Verify APK mirror
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/apk/releases/${APP_VERSION_NAME}/app.apk"
          code=$(curl -L -sS -o /dev/null -w "%{http_code}" --retry 3 --connect-timeout 15 --max-time 60 "${URL}?v=${APP_VERSION_CODE}")
          echo "APK mirror HTTP status: ${code}"
          test "${code}" = "200"

      - name: Publish update manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone

          version = os.environ["APP_VERSION_NAME"]
          code = int(os.environ["APP_VERSION_CODE"])
          repo = os.environ["GITHUB_REPOSITORY"]

          apk_path = "dist/app.apk"
          import hashlib
          with open(apk_path, "rb") as f:
              apk_sha256 = hashlib.sha256(f.read()).hexdigest()
          apk_size = os.path.getsize(apk_path)

          update = {
              "version": version,
              "versionCode": code,
              "published_at": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "repo": repo,
              "apk_size": apk_size,
              "sha256": apk_sha256,
              "apk_url": f"https://raw.githubusercontent.com/{repo}/apk/releases/{version}/app.apk",
              "apk_urls": [
                  f"https://raw.githubusercontent.com/{repo}/apk/releases/{version}/app.apk",
                  f"https://github.com/{repo}/releases/download/v{version}/app.apk",
                  f"https://cdn.jsdelivr.net/gh/{repo}@apk/releases/{version}/app.apk",
                  f"https://fastly.jsdelivr.net/gh/{repo}@apk/releases/{version}/app.apk",
                  f"https://gcore.jsdelivr.net/gh/{repo}@apk/releases/{version}/app.apk"
              ],
              "notes": f"{version}：修复设置页函数名错配，并加强 APK 下载完整性校验与更新链路。",
          }
          with open("update.json", "w", encoding="utf-8") as f:
              json.dump(update, f, ensure_ascii=False, indent=2)
              f.write("\n")

          # 发布前硬校验：清单版本与 APK 镜像路径必须严格一致。
          check = json.loads(open("update.json", encoding="utf-8").read())
          assert check["version"] == version
          assert int(check["versionCode"]) == code
          assert check["apk_url"] == f"https://raw.githubusercontent.com/{repo}/apk/releases/{version}/app.apk"
          assert any(f"/releases/{version}/app.apk" in u for u in check["apk_urls"])
          assert re.fullmatch(r"[0-9a-f]{64}", check["sha256"])
          assert int(check["apk_size"]) == os.path.getsize("dist/app.apk")
          assert check["sha256"] == hashlib.sha256(open("dist/app.apk","rb").read()).hexdigest()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json
          if git diff --cached --quiet; then
            echo "update.json already current"
          else
            git commit -m "发布更新清单 ${APP_VERSION_NAME}"
            git push origin HEAD:main
          fi
      - name: Verify published update manifest
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST_URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/update.json"
          curl -fsSL --retry 3 --connect-timeout 15 --max-time 60 "${MANIFEST_URL}?v=${APP_VERSION_CODE}" -o /tmp/live-update.json
          python - <<'PY'
          import json, os
          data=json.load(open("/tmp/live-update.json",encoding="utf-8"))
          assert data["version"] == os.environ["APP_VERSION_NAME"]
          assert int(data["versionCode"]) == int(os.environ["APP_VERSION_CODE"])
          assert data["apk_url"].endswith(f"/releases/{os.environ['APP_VERSION_NAME']}/app.apk")
          print("Published manifest verified:", data["version"], data["versionCode"])
          PY
      - name: Publish latest APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION_NAME }}
          name: 股票判断机 GPT v${{ env.APP_VERSION_NAME }}
          body: |
            自动构建（run #${{ github.run_number }}）。
            - versionName: v${{ env.APP_VERSION_NAME }}
            - versionCode: ${{ env.APP_VERSION_CODE }}
            - 签名：固定正式签名密钥（每次一致，可直接覆盖安装）
          prerelease: false
          make_latest: true
          overwrite_files: true
          files: dist/app.apk
      - name: Verify GitHub Release APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${APP_VERSION_NAME}/app.apk"
          code=$(curl -L -sS -o /dev/null -w "%{http_code}" --retry 3 --connect-timeout 15 --max-time 60 "${URL}")
          echo "release APK HTTP status: ${code}"
          test "${code}" = "200"
