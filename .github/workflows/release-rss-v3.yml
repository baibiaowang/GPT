name: Bridge RSS 3.0 Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-rss-v3.yml'

permissions:
  contents: write

concurrency:
  group: bridge-rss-v3
  cancel-in-progress: true

env:
  ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
  ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
  ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GPT bridge repository
        uses: actions/checkout@v4

      - name: Checkout RSS 3.0 source
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/baibiaowang/RSS.git rss-source
          cd rss-source
          echo "RSS_SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Validate RSS 3.0 identity
        working-directory: rss-source
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('node:fs');
          const pkg=JSON.parse(fs.readFileSync('package.json','utf8'));
          const cap=JSON.parse(fs.readFileSync('capacitor.config.json','utf8'));
          const app=fs.readFileSync('app.js','utf8');
          const version=String(pkg.version||'').trim();
          const versionCode=Number(pkg.versionCode||0);
          if(!/^3\.\d+\.\d+$/.test(version))throw new Error('RSS package version must be 3.x.y');
          if(!Number.isSafeInteger(versionCode)||versionCode<=0)throw new Error('RSS package versionCode invalid');
          if(cap.appId!=='com.baibiaowang.stockjudge')throw new Error('RSS applicationId must remain com.baibiaowang.stockjudge');
          if(!app.includes(`APP_VERSION='${version}'`)||!app.includes(`APP_VERSION_CODE=${versionCode}`))throw new Error(`RSS app.js version constants incorrect for ${version}/${versionCode}`);
          if(!fs.existsSync('android/app/build.gradle'))throw new Error('Committed RSS Android project missing');
          const gradle=fs.readFileSync('android/app/build.gradle','utf8');
          if(!gradle.includes(`versionCode ${versionCode}`)||!gradle.includes(`versionName "${version}"`))throw new Error(`Android project version constants incorrect for ${version}/${versionCode}`);
          fs.appendFileSync(process.env.GITHUB_ENV,`RSS_VERSION=${version}\nRSS_VERSION_CODE=${versionCode}\n`);
          console.log(`RSS release target: ${version} / ${versionCode}`);
          NODE

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14.3'

      - name: Restore old signing material
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          missing=''
          [ -z "${ANDROID_KEYSTORE_BASE64:-}" ] && missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -z "${ANDROID_KEYSTORE_PASSWORD:-}" ] && missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ -z "${ANDROID_KEY_ALIAS:-}" ] && missing="$missing ANDROID_KEY_ALIAS"
          [ -z "${ANDROID_KEY_PASSWORD:-}" ] && missing="$missing ANDROID_KEY_PASSWORD"
          if [ -n "$missing" ]; then echo "::error::旧股票判断机签名 secrets 不完整:$missing"; exit 1; fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > signing.p12
          echo "SIGNING_KEYSTORE_PATH=$PWD/signing.p12" >> "$GITHUB_ENV"

      - name: Install RSS dependencies
        working-directory: rss-source
        run: npm install --no-audit --no-fund

      - name: RSS pre-build self-check
        working-directory: rss-source
        run: node scripts/self-check.mjs

      - name: Prepare mobile web
        working-directory: rss-source
        run: node native/inject.mjs

      - name: Prepare Android project
        working-directory: rss-source
        run: |
          set -euo pipefail
          if [ -d android ]; then
            echo "使用 RSS 仓库中已提交的 Android 工程"
            npx cap sync android
          else
            echo "仓库尚无 Android 工程，使用 Capacitor 生成"
            npx cap add android
          fi

      - name: Inject RSS native bridge
        working-directory: rss-source
        run: |
          set -euo pipefail
          mkdir -p android/app/src/main/java/com/baibiaowang/stockjudge
          cp native/MainActivity.java android/app/src/main/java/com/baibiaowang/stockjudge/MainActivity.java
          node native/patch-manifest.mjs
          node native/patch-version.mjs
          node native/patch-icon.mjs
          node --check native/inject.mjs
          node --check native/patch-manifest.mjs
          node --check native/patch-version.mjs
          node --check native/patch-icon.mjs
          node --check app.js
          cmp native/MainActivity.java android/app/src/main/java/com/baibiaowang/stockjudge/MainActivity.java
          git diff --check
          ! grep -RInE 'agu-ann-feed\\.app\\.workbuddy\\.host/feed\\?token=[0-9A-Fa-f]{32,}' --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=build --exclude-dir=.gradle .

      - name: Configure fixed release signing
        working-directory: rss-source
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('node:fs');
          const p='android/app/build.gradle';
          let s=fs.readFileSync(p,'utf8');
          if(!/signingConfigs\s*\{/.test(s)){
            s=s.replace(/buildTypes\s*\{/,`signingConfigs {
              release {
                storeFile file(System.getenv('SIGNING_KEYSTORE_PATH'))
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
              }
            }

            buildTypes {`);
          }
          if(!/signingConfig\s+signingConfigs\.release/.test(s)){
            s=s.replace(/buildTypes\s*\{\s*release\s*\{/,'buildTypes { release { signingConfig signingConfigs.release');
          }
          fs.writeFileSync(p,s);
          NODE

      - name: Sync
        working-directory: rss-source
        run: npx cap sync android

      - name: Build release APK
        working-directory: rss-source/android
        run: gradle assembleRelease --no-daemon

      - name: Verify signature and APK
        working-directory: rss-source
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "$APK"
          CURRENT_DIGEST=$("$BT/apksigner" verify --print-certs "$APK" | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)
          test -n "$CURRENT_DIGEST"
          echo "3.0 signing cert: $CURRENT_DIGEST"
          for VERSION in 2.1.13 2.1.7 2.1.6; do
            URL="https://github.com/baibiaowang/GPT/releases/download/v${VERSION}/app.apk"
            if curl -fsSL --retry 2 --connect-timeout 15 --max-time 60 "$URL" -o "/tmp/gpt-${VERSION}.apk"; then
              OLD_DIGEST=$("$BT/apksigner" verify --print-certs "/tmp/gpt-${VERSION}.apk" | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)
              echo "v${VERSION} signing cert: $OLD_DIGEST"
              test "$CURRENT_DIGEST" = "$OLD_DIGEST"
            else
              echo "v${VERSION} APK unavailable; skip comparison"
            fi
          done
          mkdir -p dist
          cp "$APK" dist/app.apk
          RSS_APK_SHA256=$(sha256sum dist/app.apk | awk '{print $1}')
          RSS_APK_SIZE=$(stat -c%s dist/app.apk)
          test "${#RSS_APK_SHA256}" -eq 64
          test "$RSS_APK_SIZE" -gt 1048576
          echo "APK size: $RSS_APK_SIZE"
          echo "APK sha256: $RSS_APK_SHA256"
          {
            echo "RSS_APK_SHA256=$RSS_APK_SHA256"
            echo "RSS_APK_SIZE=$RSS_APK_SIZE"
          } >> "$GITHUB_ENV"
          sha256sum dist/app.apk | tee dist/app.sha256

      - name: Publish 3.0 APK mirror on GPT
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: rss-source
        run: |
          set -euo pipefail
          rm -rf /tmp/gpt-apk-mirror
          git clone --depth 1 "https://x-access-token:$GH_TOKEN@github.com/${GITHUB_REPOSITORY}.git" /tmp/gpt-apk-mirror
          cd /tmp/gpt-apk-mirror
          if git ls-remote --exit-code origin refs/heads/apk >/dev/null 2>&1; then
            git fetch origin refs/heads/apk:refs/remotes/origin/apk
            git checkout -B apk refs/remotes/origin/apk
          else
            git checkout --orphan apk
            git rm -rf . >/dev/null 2>&1 || true
          fi
          if git cat-file -e "HEAD:releases/${RSS_VERSION}/app.apk" 2>/dev/null; then
            EXISTING_SHA=$(git show "HEAD:releases/${RSS_VERSION}/app.apk" | sha256sum | awk '{print $1}')
            if [ "$EXISTING_SHA" != "$RSS_APK_SHA256" ]; then
              echo "::error::版本 ${RSS_VERSION} 已存在但 SHA-256 不同，拒绝覆盖。"
              exit 1
            fi
            echo "版本 ${RSS_VERSION} APK 已存在且字节一致，跳过覆盖（幂等发布）。"
          else
            mkdir -p "releases/${RSS_VERSION}"
            cp "$GITHUB_WORKSPACE/rss-source/dist/app.apk" "releases/${RSS_VERSION}/app.apk"
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "releases/${RSS_VERSION}/app.apk"
          if ! git diff --cached --quiet; then git commit -m "发布自制RSS ${RSS_VERSION} 升级 APK"; git push origin HEAD:apk; fi

      - name: Create or refresh GPT Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ASSET="rss-source/dist/zizhi-rss-${RSS_VERSION}.apk"
          cp rss-source/dist/app.apk "$ASSET"
          TAG="v${RSS_VERSION}"
          TITLE="自制RSS ${RSS_VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            rm -f "/tmp/zizhi-rss-${RSS_VERSION}.apk"
            gh release download "$TAG" --pattern "zizhi-rss-${RSS_VERSION}.apk" --dir /tmp --clobber
            EXISTING_RELEASE_SHA=$(sha256sum "/tmp/zizhi-rss-${RSS_VERSION}.apk" | awk '{print $1}')
            if [ "$EXISTING_RELEASE_SHA" != "$RSS_APK_SHA256" ]; then
              echo "::error::GitHub Release $TAG 已存在但 APK SHA-256 不同，拒绝覆盖。"
              exit 1
            fi
            echo "GitHub Release $TAG 已存在且 APK 字节一致，跳过覆盖（幂等发布）。"
          else
            gh release create "$TAG" "$ASSET" --title "$TITLE" --notes "自制RSS：由旧股票判断机正式切换为 RSS 阅读模式。\n\nRSS source commit: ${RSS_SOURCE_COMMIT}"
          fi
      - name: Verify published APK URLs
        working-directory: rss-source
        run: |
          set -euo pipefail
          PRIMARY_RAW="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/apk/releases/${RSS_VERSION}/app.apk"
          PRIMARY_RELEASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${RSS_VERSION}/zizhi-rss-${RSS_VERSION}.apk"
          sleep 15
          for URL in "$PRIMARY_RAW" "$PRIMARY_RELEASE"; do
            ok=0
            for attempt in $(seq 1 24); do
              rm -f /tmp/verify-rss.apk
              VERIFY_URL="${URL}$(printf '%s' "$URL" | grep -q '?' && printf '&' || printf '?')_verify=${GITHUB_RUN_ID}-${attempt}"
              if curl -fsSL --connect-timeout 15 --max-time 120 "$VERIFY_URL" -o /tmp/verify-rss.apk; then
                ACTUAL_SIZE=$(stat -c%s /tmp/verify-rss.apk)
                ACTUAL_SHA=$(sha256sum /tmp/verify-rss.apk | awk '{print $1}')
                if [ "$ACTUAL_SIZE" = "$RSS_APK_SIZE" ] && [ "$ACTUAL_SHA" = "$RSS_APK_SHA256" ]; then
                  echo "verified: $URL"
                  ok=1
                  break
                fi
                echo "attempt $attempt mismatch: size=$ACTUAL_SIZE sha=$ACTUAL_SHA"
              else
                echo "attempt $attempt download failed: $URL"
              fi
              sleep 5
            done
            test "$ok" -eq 1
          done

      - name: Generate compatible update.json
        working-directory: rss-source
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          from datetime import datetime,timezone
          version=os.environ['RSS_VERSION'];code=int(os.environ['RSS_VERSION_CODE'])
          repo=os.environ['GITHUB_REPOSITORY']
          data={
            'version':version,'versionCode':code,
            'published_at':datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ'),
            'repo':'baibiaowang/GPT','apk_size':int(os.environ['RSS_APK_SIZE']),
            'source_commit':os.environ['RSS_SOURCE_COMMIT'],
            'sha256':os.environ['RSS_APK_SHA256'],
            'apk_url':f'https://raw.githubusercontent.com/{repo}/apk/releases/{version}/app.apk',
            'apk_urls':[
              f'https://raw.githubusercontent.com/{repo}/apk/releases/{version}/app.apk',
              f'https://github.com/{repo}/releases/download/v{version}/zizhi-rss-{version}.apk'],
            'notes':f'自制RSS {version}：旧股票判断机正式切换为 RSS 模式。'}
          json.dump(data,open('gpt-update.json','w',encoding='utf-8'),ensure_ascii=False,indent=2);open('gpt-update.json','a',encoding='utf-8').write('\n')
          PY

      - name: Publish GPT update.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git reset --hard origin/main
          cp rss-source/gpt-update.json update.json
          git add update.json
          git diff --cached --quiet || git commit -m '发布自制RSS 3.0 升级清单'
          git push origin HEAD:main

      - name: Verify published update chain
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --connect-timeout 15 --max-time 60 "https://raw.githubusercontent.com/baibiaowang/GPT/main/update.json?nocache=$(date +%s)" -o /tmp/live-update.json
          python - <<'PY'
          import hashlib,json,os,urllib.request
          m=json.load(open('/tmp/live-update.json',encoding='utf-8'))
          assert m['version']==os.environ['RSS_VERSION']
          assert int(m['versionCode'])==int(os.environ['RSS_VERSION_CODE'])
          assert m['repo']=='baibiaowang/GPT'
          assert m['sha256']==os.environ['RSS_APK_SHA256']
          assert int(m['apk_size'])==int(os.environ['RSS_APK_SIZE'])
          assert m['source_commit']==os.environ['RSS_SOURCE_COMMIT']
          assert len(m['sha256'])==64 and '/GPT/' in m['apk_url']
          req=urllib.request.Request(m['apk_url']+'?final_verify='+os.environ['GITHUB_RUN_ID'],headers={'User-Agent':'GPT-release-verifier/1.0'})
          with urllib.request.urlopen(req,timeout=120) as r:
              data=r.read()
          assert len(data)==int(m['apk_size'])
          assert hashlib.sha256(data).hexdigest()==m['sha256']
          print('Old 2.1.x compatible manifest + APK verified.')
          PY
# Release trigger: rebuild from current RSS main and verify the published APK bytes before publishing update.json.
# Release trigger 2: rebuild after RSS source-script correction.
# Release trigger 3: rebuild after idempotent Manifest patch correction.
# Release trigger 4: rebuild after source-scan scope correction and Android callback fixes.
# Release trigger 5: rebuild 3.0.4 with extended CDN propagation verification.
# Release trigger 14: 3.0.7 update-manifest multi-source fallback.
# RSS source of truth: baibiaowang/RSS main; GPT remains distribution bridge for legacy upgrade continuity.
# Retry after Android resource deduplication in committed RSS project.

# Retry after RSS native bridge compile fix.

# Retry after FEED_PART migration cleanup.
