<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#e63b3b" />
  <meta name="description" content="自制RSS · 股票公告与公告总结 RSS 阅读器" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="assets/rss-icon.svg" />
  <link rel="icon" href="assets/rss-icon.svg" type="image/svg+xml" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23e63b3b'/%3E%3Cpath d='M14 43h10V29H14zm13 0h10V19H27zm13 0h10V10H40z' fill='white'/%3E%3C/svg%3E" />
  <title>自制RSS</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div><div class="eyebrow">LOCAL READER</div><h1 id="pageTitle">订阅</h1></div>
      <div class="topbar-actions"><button class="icon-button" id="refreshButton" aria-label="刷新订阅" title="刷新订阅"><span class="icon icon-refresh"></span></button></div>
    </header>
    <main id="app" class="main-content"></main>
    <nav class="bottom-nav" aria-label="主导航">
      <button class="nav-item active" data-page="subscriptions"><span class="nav-icon">◎</span><span>订阅</span></button>
      <button class="nav-item" data-page="favorites"><span class="nav-icon">★</span><span>收藏</span></button>
      <button class="nav-item" data-page="notes"><span class="nav-icon">✎</span><span>点评</span></button>
      <button class="nav-item" data-page="settings"><span class="nav-icon">⚙</span><span>设置</span></button>
    </nav>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="modalRoot"></div>
  <input id="importFile" type="file" accept="application/json,.json" hidden />
  <script src="app.js"></script>
</body>
</html>
