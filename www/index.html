<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=yes">
<meta name="theme-color" content="#C8102E">
<title>股票判断机</title>
<style>
:root{
  --bg:#f5f5f7;
  --card:#fff;
  --text:#1c1c1e;
  --muted:#6e6e73;
  --line:rgba(60,60,67,.12);
  --brand:#c8102e;
  --brand-soft:rgba(200,16,46,.09);
  --nav:rgba(249,249,249,.86);
  --shadow:0 1px 3px rgba(0,0,0,.05);
  --radius:18px;
  --top-height:82px;
}
@media(prefers-color-scheme:dark){
  :root{
    --bg:#000;
    --card:#1c1c1e;
    --text:#fff;
    --muted:#a1a1a6;
    --line:rgba(235,235,245,.12);
    --nav:rgba(28,28,30,.92);
    --brand:#ff375f;
    --brand-soft:rgba(255,55,95,.16);
    --shadow:none;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
  margin:0;
  min-height:100%;
  max-width:100%;
  overflow-x:hidden;
  background:var(--bg);
  color:var(--text);
  font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","PingFang SC","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
}
body{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
button,input,textarea,select{font:inherit;color:inherit;font-family:inherit;max-width:100%}
button{cursor:pointer}
.wrap{width:100%;max-width:860px;margin:0 auto;padding:0 14px calc(105px + env(safe-area-inset-bottom))}
.top{
  position:sticky;
  top:0;
  z-index:80;
  background:var(--bg);
  backdrop-filter:saturate(180%) blur(22px);
  -webkit-backdrop-filter:saturate(180%) blur(22px);
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
  border-bottom:.5px solid var(--line);
}
.top-title{font-size:22px;line-height:1.15;font-weight:800;letter-spacing:-.3px}
.search{margin-top:8px}
.search.hidden{display:none}
.search input{
  width:100%;
  height:38px;
  border:0;
  border-radius:12px;
  padding:0 13px;
  background:rgba(118,118,128,.12);
  outline:none;
}
.search input::placeholder{color:var(--muted)}
.page{display:none}
.page.on{display:block}
.hero-count{display:flex;align-items:center;justify-content:space-between;padding:13px 2px 8px}
.count{font-size:16px;font-weight:700}
.mini-note{font-size:12px;color:var(--muted)}
.card{background:var(--card);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);margin:12px 0}
.card-hd{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:12px 16px 10px;
  border-bottom:.5px solid var(--line);
  font-size:13px;
  font-weight:700;
  color:var(--muted);
}
.card-hd .sub{font-size:11px;font-weight:500}
.section-title{font-size:28px;font-weight:800;letter-spacing:-.5px;margin:20px 2px 8px}
.table-shell{
  width:100%;
  position:relative;
}
.table-head-scroll{
  position:sticky;
  top:var(--top-height);
  z-index:70;
  width:100%;
  overflow-x:hidden;
  overflow-y:hidden;
  background:var(--card);
  border-radius:0;
}
.table-scroll{
  width:100%;
  overflow-x:auto;
  overflow-y:visible;
  position:relative;
  -webkit-overflow-scrolling:touch;
  isolation:isolate;
}
.data-table{
  width:max-content;
  min-width:100%;
  border-collapse:separate;
  border-spacing:0;
  background:var(--card);
  table-layout:fixed;
}
.data-table-head{
  min-width:max-content;
}
.data-table thead{
  background:var(--card);
}
.data-table thead th{
  position:static;
  background:var(--card);
  color:var(--muted);
  text-align:left;
  font-size:11px;
  font-weight:800;
  line-height:1.15;
  min-width:96px;
  padding:8px 10px;
  border-bottom:.5px solid var(--line);
  box-shadow:0 2px 0 var(--line),0 3px 8px rgba(0,0,0,.04);
  white-space:normal;
}
.data-table thead th .cid{
  display:block;
  font-size:9px;
  line-height:1.05;
  opacity:.62;
  margin-bottom:2px;
}
.data-table tbody td{
  background:var(--card);
  min-width:96px;
  max-width:340px;
  padding:10px 10px;
  border-bottom:.5px solid var(--line);
  font-size:13px;
  vertical-align:middle;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.data-table tbody tr:last-child td{border-bottom:0}
.data-table tbody tr:active td{background:var(--brand-soft)}
.empty{padding:48px 20px;text-align:center;color:var(--muted);line-height:1.7}
.tabbar{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding:4px 2px 10px;
  margin:0 -2px;
  scrollbar-width:none;
}
.tabbar::-webkit-scrollbar{display:none}
.tab{
  flex:0 0 auto;
  border:0;
  background:rgba(118,118,128,.12);
  color:var(--muted);
  border-radius:999px;
  padding:8px 12px;
  font-size:12px;
  font-weight:700;
  display:inline-flex;
  align-items:center;
  gap:5px;
}
.tab.on{background:var(--brand);color:#fff;box-shadow:0 4px 12px rgba(200,16,46,.2)}
.tab b{font-size:10px;opacity:.72}
.setting-item{padding:13px 16px;border-bottom:.5px solid var(--line)}
.setting-item:last-child{border-bottom:0}
.setting-title{font-size:14px;font-weight:700}
.setting-desc{margin-top:4px;font-size:11.5px;color:var(--muted);line-height:1.5}
.setting-actions{margin-top:9px;display:flex;gap:7px;flex-wrap:wrap}
.sbtn{
  border:0;
  background:rgba(118,118,128,.12);
  border-radius:11px;
  padding:8px 10px;
  font-size:12px;
  font-weight:600;
}
.sbtn.primary{background:var(--brand);color:#fff}
.display-settings-card{margin-top:10px}
.column-item{display:flex;align-items:center;gap:9px;padding:8px 0;border-top:.5px solid var(--line)}
.column-item:first-child{border-top:0}
.column-item input{flex:0 0 auto}
.column-main{min-width:0}
.column-name{display:block;font-size:12px;font-weight:700}
.column-meta{display:block;margin-top:2px;font-size:10px;color:var(--muted)}
.filter-settings{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}
.filter-settings label{font-size:11px;color:var(--muted)}
.filter-display-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:9px;
}
.filter-display-grid label{
  display:block;
  font-size:11px;
  color:var(--muted);
}
.filter-display-grid select{
  width:100%;
  min-height:37px;
  margin-top:3px;
  padding:5px 8px;
  border:1px solid var(--line);
  border-radius:10px;
  background:var(--bg);
  outline:none;
  font-size:12px;
}
.filter-settings select{
  width:100%;
  min-height:37px;
  margin-top:3px;
  padding:5px 8px;
  border:1px solid var(--line);
  border-radius:10px;
  background:var(--bg);
  outline:none;
  font-size:12px;
}
.detail{
  position:fixed;
  inset:0;
  z-index:120;
  background:var(--bg);
  overflow:auto;
  transform:translateX(100%);
  transition:transform .25s cubic-bezier(.32,.72,0,1);
  padding-bottom:calc(28px + env(safe-area-inset-bottom));
}
.detail.show{transform:translateX(0)}
.dnav{
  position:sticky;
  top:0;
  z-index:130;
  display:flex;
  align-items:center;
  gap:8px;
  padding:calc(8px + env(safe-area-inset-top)) 12px 8px;
  background:rgba(242,242,247,.86);
  backdrop-filter:saturate(180%) blur(22px);
  -webkit-backdrop-filter:saturate(180%) blur(22px);
  border-bottom:.5px solid var(--line);
}
.back{
  border:0;
  background:rgba(118,118,128,.12);
  color:var(--brand);
  border-radius:10px;
  padding:7px 10px;
  font-weight:700;
}
.dt{flex:1;min-width:0;text-align:center;font-size:15px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dbody{max-width:860px;margin:0 auto;padding:0 14px}
.hero{padding:18px 2px 8px}
.hero h1{margin:0;font-size:26px;line-height:1.2;overflow-wrap:anywhere}
.meta{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap}
.tag{
  display:inline-flex;
  align-items:center;
  padding:3px 7px;
  border-radius:8px;
  background:rgba(118,118,128,.12);
  font-size:10.5px;
  color:var(--muted);
}
.detail-actions{display:flex;gap:8px;padding:10px 0 2px}
.detail-actions .sbtn{flex:0 0 auto}
.standard-cell{
  display:grid;
  grid-template-columns:120px minmax(0,1fr);
  gap:12px;
  padding:12px 16px;
  border-top:.5px solid var(--line);
}
.standard-cell:first-of-type{border-top:0}
.standard-label{font-size:11.5px;color:var(--muted);font-weight:700}
.standard-label .cid{display:block;font-size:9px;opacity:.62;margin-bottom:2px}
.standard-value{min-width:0;font-size:13.5px;line-height:1.55;overflow-wrap:anywhere;white-space:pre-wrap}
.comment-editor{padding:12px 16px 16px}
.comment-editor textarea{
  width:100%;
  min-height:110px;
  border:1px solid var(--line);
  background:var(--bg);
  border-radius:11px;
  padding:9px;
  outline:none;
  resize:vertical;
}
.comment-editor .sbtn{margin-top:8px;width:100%}
.status-stats{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:8px;
  margin:0 0 10px;
}
.status-stat{
  min-width:0;
  background:var(--card);
  border-radius:14px;
  padding:11px 10px;
  box-shadow:var(--shadow);
  text-align:center;
  border:1px solid var(--line);
}
.status-stat-n{
  display:block;
  font-size:22px;
  line-height:1.1;
  font-weight:850;
}
.status-stat-l{
  display:block;
  margin-top:4px;
  font-size:11px;
  color:var(--muted);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.setting-readonly{
  min-height:37px;
  margin-top:3px;
  padding:6px 9px;
  border:1px solid var(--line);
  border-radius:10px;
  background:var(--bg);
  display:flex;
  flex-direction:column;
  justify-content:center;
  gap:1px;
}
.setting-readonly span{
  font-size:10px;
  color:var(--muted);
}
.setting-readonly strong{
  font-size:12px;
  line-height:1.2;
}
.setting-readonly small{
  font-size:9px;
  color:var(--muted);
}
.url-link{
  display:inline-flex;
  align-items:center;
  max-width:100%;
  color:var(--brand);
  text-decoration:none;
  font-weight:800;
  white-space:nowrap;
}
.url-link:active,.url-link:hover{text-decoration:underline}
.data-table tbody .url-link{
  padding:5px 8px;
  border-radius:9px;
  background:var(--brand-soft);
}
.saved-group-title{
  padding:11px 4px 4px;
  font-size:11px;
  color:var(--muted);
}
.bottom{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:150;
  display:flex;
  gap:2px;
  background:var(--nav);
  backdrop-filter:saturate(180%) blur(18px);
  -webkit-backdrop-filter:saturate(180%) blur(18px);
  border-top:.5px solid var(--line);
  padding:6px 4px calc(6px + env(safe-area-inset-bottom));
}
.bottom button{
  flex:1;
  min-width:0;
  border:0;
  background:transparent;
  color:var(--muted);
  padding:4px 1px;
  font-size:9.5px;
}
.bottom .ic{display:block;font-size:17px;line-height:19px;margin-bottom:1px}
.bottom button.on{color:var(--brand);font-weight:800}
.mask{
  position:fixed;
  inset:0;
  z-index:200;
  display:none;
  align-items:flex-end;
  background:rgba(0,0,0,.4);
}
.mask.show{display:flex}
.sheet{
  width:100%;
  max-width:860px;
  margin:0 auto;
  max-height:88vh;
  overflow:auto;
  background:var(--card);
  border-radius:22px 22px 0 0;
  padding-bottom:calc(12px + env(safe-area-inset-bottom));
}
.sheet-grab{width:38px;height:5px;border-radius:4px;background:rgba(118,118,128,.25);margin:8px auto}
.sheet h3{margin:16px 20px 12px;font-size:18px}
.note{padding:0 16px 10px;color:var(--muted);font-size:11.5px;line-height:1.6}
.sheet-body{padding:0 16px 8px}
.sheet-body input,.sheet-body textarea{
  width:100%;
  min-height:42px;
  border:1px solid var(--line);
  background:var(--bg);
  border-radius:10px;
  padding:8px 10px;
  outline:none;
}
.sheet-body textarea{min-height:110px;resize:vertical}
.sheet-actions{display:flex;gap:8px;padding:4px 16px 16px}
.sheet-actions .sbtn{flex:1}
.update-progress{display:none;margin-top:10px}
.update-progress.show{display:block}
.update-progress-top{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:5px}
.update-progress-bar{height:7px;border-radius:999px;background:rgba(118,118,128,.12);overflow:hidden}
.update-progress-fill{height:100%;width:0;background:var(--brand);border-radius:inherit;transition:width .2s ease}
.toast{
  position:fixed;
  left:50%;
  bottom:118px;
  z-index:250;
  transform:translate(-50%,8px);
  max-width:88vw;
  padding:9px 15px;
  border-radius:999px;
  background:rgba(0,0,0,.84);
  color:#fff;
  font-size:12px;
  text-align:center;
  opacity:0;
  pointer-events:none;
  transition:.2s;
}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:520px){
  .filter-settings{grid-template-columns:1fr}
  .status-stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .standard-cell{grid-template-columns:96px minmax(0,1fr);gap:9px}
  .data-table thead th,.data-table tbody td{min-width:96px}
}
</style>
</head>
<body>
<header class="top" id="topBar">
  <div class="top-title" id="topTitle">表格</div>
  <div class="search" id="searchBar">
    <input id="searchInput" type="search" placeholder="搜索表格内容" autocomplete="off">
  </div>
</header>

<main class="wrap">
  <section id="page-home" class="page on">
    <div id="homeList"></div>
  </section>

  <section id="page-types" class="page">
    <div class="section-title">类型</div>
    <div class="tabbar" id="typeTabs"></div>
    <div id="typesList"></div>
  </section>

  <section id="page-filters" class="page">
    <div class="section-title">筛选</div>
    <div class="tabbar" id="filterTabs"></div>
    <div id="filterList"></div>
  </section>

  <section id="page-comments" class="page">
    <div class="section-title">点评</div>
    <div id="commentList"></div>
  </section>

  <section id="page-favorites" class="page">
    <div class="section-title">收藏</div>
    <div id="favList"></div>
  </section>

  <section id="page-settings" class="page">
    <div class="section-title">设置</div>
  </section>
</main>

<div class="detail" id="detail">
  <div class="dnav">
    <button class="back" id="detailBack">‹ 返回</button>
    <div class="dt" id="detailTitle"></div>
    <div style="width:54px"></div>
  </div>
  <div class="dbody">
    <div id="detailHero"></div>
    <div id="detailBody"></div>
  </div>
</div>

<nav class="bottom" id="bottomNav">
  <button data-page="home" class="on"><span class="ic">⌂</span>首页</button>
  <button data-page="types"><span class="ic">☷</span>类型</button>
  <button data-page="filters"><span class="ic">◉</span>筛选</button>
  <button data-page="comments"><span class="ic">✎</span>点评</button>
  <button data-page="favorites"><span class="ic">★</span>收藏</button>
  <button data-page="settings"><span class="ic">⚙</span>设置</button>
</nav>

<div class="mask" id="mask"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script src="core/table-model.js"></script>
<script src="core/cell-model.js"></script>
<script src="core/column-manager.js"></script>
<script src="core/row-manager.js"></script>
<script src="core/filter-engine.js"></script>
<script src="core/local-annotation.js"></script>
<script src="core/app-runtime.js"></script>
</body>
</html>
